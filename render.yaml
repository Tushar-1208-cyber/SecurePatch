# =========================================================
# SecurePatch Cloud Deployment - Render Blueprint
# Automatically provisions free-tier FastAPI Backend
# =========================================================

services:
  - type: web
    name: securepatch-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install bandit pytest
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: 1
      - key: WORKSPACE_DIR
        value: /opt/render/project/src/workspace
